<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>花畑</title>

<style>
.area{
    position: relative;
    width: 1200px;
    margin: auto;
}

.bg{
    width: 100%;
}

.message{
    position: absolute;
    top: 40px;
    left: 40px;

    background: rgba(255,255,255,0.7);
    padding: 20px;

    color: deeppink;
    font-size: 28px;
    font-weight: bold;
    border-radius: 10px;
}

.butterfly{
    position: absolute;
    width: 70px;
}

.b1{
    left: 180px;
    top: 650px;
}

.b2{
    left: 600px;
    top: 520px;
}

.b3{
    left: 980px;
    top: 620px;
}
</style>

</head>

<body>

<div class="area">

    <!-- 背景画像 -->
    <img src="bg0.png" class="bg">

    <!-- メッセージ -->
    <div class="message">
        ぽかぽか陽気の穏やかな朝<br>
        花畑では、蝶々がのんびり飛んでいます
    </div>

    <!-- 蝶 -->
    <img src="butterfly.gif" class="butterfly b1">
    <img src="butterfly.gif" class="butterfly b2">
    <img src="butterfly.gif" class="butterfly b3">

</div>

</body>
</html>
