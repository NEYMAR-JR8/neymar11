<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>花畑</title>

<style>
.area{
    position:relative;
    width:900px;
}

.bg{
    width:900px;
}

.message{
    position:absolute;
    top:30px;
    left:30px;
    background-color:white;
    color:deeppink;
    font-size:32px;
    padding:15px;
    border-radius:10px;
}

.b1{
    position:absolute;
    left:150px;
    top:450px;
}

.b2{
    position:absolute;
    left:400px;
    top:520px;
}

.b3{
    position:absolute;
    left:700px;
    top:380px;
}

.butterfly{
    width:70px;
}
</style>

</head>

<body>

<div class="area">

    <img src="bg0.png" class="bg">

    <div class="message">
        ぽかぽか陽気の穏やかな朝<br>
        花畑では、蝶々がのんびり飛んでいます
    </div>

    <img src="butterfly.gif" class="butterfly b1">
    <img src="butterfly.gif" class="butterfly b2">
    <img src="butterfly.gif" class="butterfly b3">

</div>

</body>
</html>
